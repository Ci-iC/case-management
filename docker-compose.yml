services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: case-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-case_mgmt}
      POSTGRES_USER: ${PG_USER:-case_mgmt}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-changeme}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-case_mgmt} -d ${PG_DB:-case_mgmt}"]
      interval: 5s
      timeout: 3s
      retries: 10
