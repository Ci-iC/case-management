services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: case-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-case_mgmt}
      POSTGRES_USER: ${PG_USER:-case_mgmt}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请在 .env 中设置 PG_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      # 宿主机用 15432（远超 Windows Hyper-V/WSL 动态保留段，最稳）
      # 容器内仍是 5432；应用连 127.0.0.1:15432
      # 之前用过 5432 → 在保留段；5500 → 也在保留段；最终选 15432
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-case_mgmt} -d ${PG_DB:-case_mgmt}"]
      interval: 5s
      timeout: 3s
      retries: 10
