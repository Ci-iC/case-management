services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: case-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-case_mgmt}
      POSTGRES_USER: ${PG_USER:-case_mgmt}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请在 .env 中设置 PG_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      # 宿主机用 5433（5432 在 Windows Hyper-V/WSL 保留段 5358-5457 内会被拒绝）
      # 容器内还是 5432，应用连 127.0.0.1:5433 即可
      - "127.0.0.1:5500:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-case_mgmt} -d ${PG_DB:-case_mgmt}"]
      interval: 5s
      timeout: 3s
      retries: 10
